[project]
name = "rag-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Parth", email = "paarthsinbox@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "numpy>=2.4.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "sentence-transformers>=5.7.0",
    "tqdm>=4.70.0",
]

[project.scripts]
rag-test = "rag_test:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
